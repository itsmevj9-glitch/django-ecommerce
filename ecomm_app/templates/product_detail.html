<!doctype html>
<html>
  <head>
    <title>Product Details</title>
  </head>

  <body>
    <h1>Product Details</h1>

    <a href="/product_list/">Back to Products</a>

    <br /><br />

    <table border="1" cellpadding="10">
      <tr>
        <th>Name</th>
        <td>{{ product.name }}</td>
      </tr>

      <tr>
        <th>Category</th>
        <td>{{ product.category.name }}</td>
      </tr>

      <tr>
        <th>Price</th>
        <td>₹{{ product.price }}</td>
      </tr>

      <tr>
        <th>Stock</th>
        <td>{{ product.stock }}</td>
      </tr>

      <tr>
        <th>Status</th>
        <td>{% if product.status %} Active {% else %} Inactive {% endif %}</td>
      </tr>
    </table>

    <br />

    <a href="/edit_product/?id={{product.id}}">Edit Product</a>

    <br /><br />

    <a href="/product_list/">Back to Product List</a>
  </body>
</html>
